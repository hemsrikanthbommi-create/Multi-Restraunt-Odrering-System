spring.application.name=api-gateway

server.port=8081

# ==============================
# EUREKA SERVER
# ==============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==============================
# USER SERVICE
# ==============================

spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**


# ==============================
# RESTAURANT SERVICE
# ==============================

spring.cloud.gateway.server.webmvc.routes[1].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RESTAURANT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/restaurants/**


# ==============================
# ORDER SERVICE - CART
# ==============================

spring.cloud.gateway.server.webmvc.routes[2].id=order-cart-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORDER-SERVICE
